name: continuum

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-continuum}
      POSTGRES_USER: ${POSTGRES_USER:-continuum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continuum_dev_database}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-continuum_dev_redis}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-continuum_dev_redis}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: continuum-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@continuum/api", "prisma:migrate:deploy"]
    environment: &api-environment
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-continuum}:${POSTGRES_PASSWORD:-continuum_dev_database}@postgres:5432/${POSTGRES_DB:-continuum}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-continuum_dev_redis}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-continuum-local-api-signing-secret-change-me}
      JWT_EXPIRES_IN_SECONDS: 3600
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-ContinuumDemo123!}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: continuum-api:local
    command: ["pnpm", "--filter", "@continuum/api", "prisma:seed"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: continuum-api:local
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXTAUTH_URL: http://localhost:${WEB_PORT:-3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-continuum-local-web-session-secret-change-me}
      INTERNAL_API_URL: http://api:3001/api/v1
      SHOW_DEMO_CREDENTIALS: ${SHOW_DEMO_CREDENTIALS:-true}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/sign-in').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
